<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
  rel="stylesheet"
/>
    <title>Shelfie</title>
  </head>
  <body>
    <div class="page">
      <header>
        <div class="logo">
          <img src="images/shelfie-logo.svg" alt="Shelfie Logo" />
        </div>
        <nav>
          <ul>
            <li><a href="#Shop">Shop</a></li>
            <li><a href="#Genres">Genres</a></li>
            <li><a href="#About">About</a></li>
          </ul>
        </nav>
        <button type="button" class="btn browse-btn">Browse books</button>
      </header>
      <section class="hero">
        <div class="left-hero">
          <div class="text-hero">
            <p class="t-up-title">NEW ARRIVALS WEEKLY</p>
            <h1>A good book is always in season</h1>
            <p class="t-under-title">
              Handpicked reads across every genre, delivered to your door.
            </p>
          </div>
          <div class="btns">
            <button type="button" class="btn btn-primary">
              Shop bestsellers
            </button>
            <button type="button" class="btn btn-outline">View genres</button>
          </div>
        </div>
        <div class="right-hero">
          <img src="images/hero" alt="Hero Image" />
        </div>
      </section>
      <section class="features">
        <h2>Shop by genre</h2>
        <div class="features-cards">
          <div class="feature-card">
            <img src="images/genre-mystery-icon.svg" alt="Mystery" />
            <p>Mystery</p>
          </div>
          <div class="feature-card">
            <img src="images/genre-romance-icon.svg" alt="Romance" />
            <p>Romance</p>
          </div>
          <div class="feature-card">
            <img src="images/genre-scifi-icon.svg" alt="Sci-Fi" />
            <p>Sci-Fi</p>
          </div>
        </div>
      </section>
      <section class="banner">
        <h3>Get 15% off your first order</h3>
        <p>Join our newsletter for weekly picks.</p>
        <div class="email">
          <input type="email" placeholder="Your email" />
          <button type="button" class="btn">Subscribe</button>
        </div>
      </section>
      <footer>
        <p>Shelfie Books 2026</p>
        <div class="socials">
          <img src="images/shelfie-instagram-icon.svg" alt="Instagram" />
          <img src="images/shelfie-x-icon.svg" alt="X" />
        </div>
      </footer>
    </div>
  </body>
</html>
